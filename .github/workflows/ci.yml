name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest

      - name: the invariants
        run: python -m pytest tests -q

      - name: the published numbers still come out the same
        run: python -m pytest tests -q -m slow

      # This is the audit, and it has to come before anything appends: the
      # committed anchor names the head of the committed ledger. A check after
      # the benchmark runs compares a fresh chain with a stale digest and fails
      # for the right reason but the wrong cause -- which is exactly what the
      # first version of this workflow did.
      - name: every pinned table hashes to its digest, and the chain matches the committed anchor
        run: python -m mspine verify

      - name: the benchmark runs and its numbers land on the chain
        run: |
          python -m mspine bench --tables concrete --seeds 1 --budget 32
          python -m mspine report

      - name: the chain is still intact after a run appended to it
        run: python -m mspine verify --chain-only

      - name: publish the new head, so the next commit is checkable against it
        run: python -m mspine anchor
